micronaut:
  application:
    name: practiq
  serde:
    serialization:
      inclusion: always
  data:
    pageable:
      default-page-size: 10
      max-page-size: 50
  object-storage:
    aws:
      # Each key here is a named storage with its own AwsS3Operations bean. Adding a second
      # one makes unqualified injection ambiguous — qualify with @Named if that day comes.
      documents:
        enabled: true
        bucket: documents

# No datasource URL here on purpose — each environment supplies its own, so a test run can
# never fall through to the dev database.
datasources:
  default:
    db-type: postgresql
    dialect: POSTGRES

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        format_sql: true

flyway:
  datasources:
    default:
      enabled: true

practiq:
  admin-key: ${PRACTIQ_ADMIN_KEY}
  s3:
    # Bounds one attempt, not the whole call. The SDK sets neither by default, so an unresponsive
    # S3 burns the 30s socket timeout on each of three attempts — and the reconcile holds a pooled
    # connection for all of it. The total budget stays open because a document download's duration
    # scales with the file; a single attempt's does not.
    api-call-attempt-timeout: 10s
  document-upload-reconcile:
    # A run takes at most this many, oldest first; the rest wait for the next one. Sized against the
    # schedule interval, so it is a drain rate as much as a cap.
    batch-size: 100
  document-upload-reconcile-scheduler:
    # An absent initial-delay is passed to the scheduler as null and becomes 0, firing a reconcile
    # while the context is still starting. Setting it keeps the first run off application startup.
    enabled: true
    interval: 15m
    initial-delay: 15m