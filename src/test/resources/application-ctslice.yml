# Component-utils slice environment. Supplies a no-op datasource so the web layer can be
# tested without a real database. Activated only by *CT tests via
# @MicronautTest(environments = "ctslice"), so integration tests (*IT) are unaffected.

# Stop the Test Resources Postgres container from starting at all. With it disabled, the
# resolver falls back to the explicit (no-op) datasources.default.url below.
test-resources:
  containers:
    postgres:
      enabled: false
    # Same for LocalStack. The base application.yml enables the `documents` object storage in
    # every environment, so a CT that ever touched it would drag a container into the no-Docker
    # tier. Disabled here so that can't happen by accident.
    localstack:
      enabled: false

datasources:
  default:
    url: jdbc:postgresql://localhost:65432/ct-no-db
    driver-class-name: org.postgresql.Driver
    # Hikari must not open a connection eagerly.
    initialization-fail-timeout: -1
    minimum-idle: 0

# Flyway off — nothing to migrate.
flyway:
  datasources:
    default:
      enabled: false

jpa:
  default:
    properties:
      hibernate:
        # Hibernate must build the SessionFactory without probing JDBC metadata for the dialect.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        temp:
          use_jdbc_metadata_defaults: false

# Presigning is a local HMAC over the request parameters — no call is made to S3 — so the CT tier
# can produce a real signed URL with LocalStack disabled and Docker out of the picture. It needs
# the region because the presigner reads it from Micronaut's Environment. No endpoint override on
# purpose: without one the URL comes out in the shape production emits, which is what the CT
# asserts. Credentials arrive as env vars from the Test task in build.gradle.kts, as everywhere.
aws:
  region: eu-west-1

practiq:
  admin-key: "b10ef800-3a3a-4395-9bbd-bfe2fa316872"
  # No scheduled work in the DB-less tier — the reconcile would have no datasource to run against.
  document-upload-reconcile-scheduler:
    enabled: false