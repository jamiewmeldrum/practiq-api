name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # A step's implicit condition is `success()`, which is what normally skips everything after
      # a failure. `!cancelled()` replaces that check, so every gate that CAN run does run and one
      # push surfaces every failure. The failures are not suppressed — the job still goes red.
      - name: Format
        if: ${{ !cancelled() }}
        run: ./gradlew spotlessCheck

      - name: ErrorProne
        id: errorprone
        if: ${{ !cancelled() }}
        run: ./gradlew compileJava compileTestJava

      - name: Tests
        if: ${{ !cancelled() && steps.errorprone.outcome == 'success' }}
        run: ./gradlew test integrationTest performanceTest --continue

      - name: Artefact
        if: ${{ !cancelled() && steps.errorprone.outcome == 'success' }}
        run: ./gradlew shadowJar

      - name: Verdict
        if: ${{ failure() }}
        run: |
          echo "One or more quality gates failed. See the step results above."
          exit 1
